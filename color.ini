; Iceni — color scheme
; Base: Catppuccin Frappe (https://github.com/catppuccin/catppuccin)
; Upstream ships four schemes (frappe/latte/macchiato/mocha); only Frappe is kept.

[iceni]
; --- Spicetify's own keys ---------------------------------------------
; With replace_colors=1 these are injected into Spotify's own CSS.
text               = c6d0f5
subtext            = c6d0f5
sidebar-text       = c6d0f5
main               = 303446
main-elevated      = 414559
highlight          = 404559
highlight-elevated = 51576d
sidebar            = 292c3c
player             = 232634
card               = 414559
shadow             = 292c3c
selected-row       = 949cbb
button             = 838ba7
button-active      = 949cbb
button-disabled    = 737994
tab-active         = 414559
notification       = 414559
notification-error = e78284
equalizer          = 000000
misc               = 51576d

; --- Catppuccin Frappe palette ----------------------------------------
; Shades, darkest to lightest
crust              = 232634
